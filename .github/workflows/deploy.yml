name: Deploy

# GitHub Pages, on every merge into `main` (the owner, 2026-10-27, #471): `pnpm pages deploy` (`tooling/pages.ts`) on
# `main` as it is, the same as from a clone: it runs `pnpm verify`, builds for `/jambot/`, checks every file the site
# references, commits the build to `gh-pages` (Pages publishes that branch as it is) and pushes it when it changed, then
# waits for https://yggi.github.io/jambot/ to serve it and checks the live site. By hand too: Actions -> Deploy -> Run
# workflow (or `actions_run_trigger` on `deploy.yml`), to deploy `main` again.
# A run that fails in seconds with no step is Actions blocked: deploy from a clone instead (the land skill).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# (one deploy at a time, never cut off halfway; a merge that lands meanwhile waits, and the newest waiting one wins)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      # The whole history, with origin/main: verify's ratchet test (tooling/history.test.ts) compares with it.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # (the gh-pages commit needs an author)
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - run: pnpm pages deploy
