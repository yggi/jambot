name: CI

# Manual only (docs/memory/repository-and-ci.md). When it can run on
# every push again, put back `push: { branches: [main] }` and `pull_request:`.
# GitHub Pages is deployed by hand from the `gh-pages` branch, with
# `pnpm pages deploy` (`tooling/pages.ts`), not from here.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # The whole history, with origin/main: the ratchet's time gate
      # (tooling/history.test.ts) compares the catalogues with it, and fails
      # in CI rather than skipping when it is missing.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm check
      - run: pnpm test
      - run: pnpm --filter @jambot/web exec playwright install --with-deps chromium
      - run: pnpm e2e
      - run: pnpm build
