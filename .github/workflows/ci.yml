name: CI

# Manual only while the Actions minutes are used up (#4): a run on every
# push fails in seconds and leaves each pull request red for no reason.
# `pnpm verify` locally is the check that counts. When minutes return, put
# back `push: { branches: [main] }` and `pull_request:`.
# GitHub Pages is deployed by hand from the `gh-pages` branch, with
# `pnpm pages deploy` (`tooling/pages.ts`), not from here.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm check
      - run: pnpm test
      - run: pnpm --filter @jambot/web exec playwright install --with-deps chromium
      - run: pnpm e2e
      - run: pnpm build
