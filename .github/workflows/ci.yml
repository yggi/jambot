name: CI

# A witness, not the gate (docs/memory/repository-and-ci.md): the gate is `pnpm verify`, which the pre-push hook runs,
# and the pull request names the commit that passed it. A run that fails in seconds with no step is Actions blocked
# (the account's minutes used up), not a verdict on the change.
# One job, on a pull request that is ready (not a draft): jobs bill rounded up to a whole minute, so the steps share one.
# The end-to-end checks by hand: Actions -> CI -> Run workflow, `e2e` ticked.
# GitHub Pages is deployed by hand from the `gh-pages` branch, with `pnpm pages deploy` (`tooling/pages.ts`), not from here.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      e2e:
        description: The end-to-end checks too (pnpm e2e, in Chromium)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The whole history, with origin/main: the ratchet's time gate
      # (tooling/history.test.ts) compares the catalogues with it, and fails
      # in CI rather than skipping when it is missing.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - if: inputs.e2e
        run: pnpm --filter @jambot/web exec playwright install --with-deps chromium
      - if: inputs.e2e
        run: pnpm e2e
