# The lobby server on Fly.io. From the repository's root:
#   fly apps create jambot-lobby   # once; the name is the address
#   pnpm lobby:deploy
# It is then reached at wss://jambot-lobby.fly.dev, TLS by Fly's proxy.
app = "jambot-lobby"
# Frankfurt: near the events. `fly regions list` names the others.
primary_region = "fra"

[env]
  PORT = "8787"

[http_service]
  internal_port = 8787
  force_https = true
  # A session lives in the one machine's memory: it must never be stopped
  # under a jam, nor spread over two machines that don't know each other.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 2500
    hard_limit = 3000

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
